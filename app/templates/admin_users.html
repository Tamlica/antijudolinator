<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin — users</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <nav>
    <a href="/admin/users">Users</a>
    <a href="/admin/patterns">Patterns</a>
    <form method="post" action="/logout"><button type="submit">Log out</button></form>
  </nav>
  <div class="container">
    <h1>Users</h1>
    {% if error %}<p style="color: var(--danger);">{{ error }}</p>{% endif %}
    <div class="card">
      <form method="post" action="/admin/users">
        <label for="username">New user's username</label>
        <input type="text" id="username" name="username" required>
        <label for="password">New user's password</label>
        <input type="password" id="password" name="password" required>
        <button type="submit" class="btn">Create user</button>
      </form>
    </div>
    {% for u in users %}
    <div class="card">
      <div class="meta">{{ u.username }} · {{ u.role }} · {{ "active" if u.is_active else "disabled" }}</div>
      <div class="actions">
        <form method="post" action="/admin/users/{{ u.id }}/toggle-active">
          <button type="submit" class="btn">{{ "Disable" if u.is_active else "Enable" }}</button>
        </form>
        <form method="post" action="/admin/users/{{ u.id }}/password" class="inline-form">
          <input type="password" name="new_password" placeholder="New password" required minlength="8" autocomplete="new-password">
          <button type="submit" class="btn">Reset password</button>
        </form>
      </div>
    </div>
    {% endfor %}
  </div>
</body>
</html>
